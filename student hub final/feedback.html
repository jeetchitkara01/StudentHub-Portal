<main class="container">
    <div class="box form-container" style="max-width: 550px; margin: 30px auto;">
        <h2>Campus Feedback & Suggestions</h2>
        <p>Share your ideas, suggestions, or grievance with department coordinators.</p>

        <form action="process_contact.php" method="POST">
            <div class="form-group">
                <label for="name">Your Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Full Name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@studenthub.edu">
            </div>

            <div class="form-group">
                <label for="category">Feedback Category</label>
                <select id="category" name="subject">
                    <option value="Academic Curriculum">Academic Curriculum</option>
                    <option value="Lab & Infrastructure">Lab & Infrastructure</option>
                    <option value="Events & Extra-curricular">Events & Extra-curricular</option>
                    <option value="General Suggestion">General Suggestion</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Detailed Feedback</label>
                <textarea id="message" name="message" rows="4" required placeholder="Write your feedback..."></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Submit Feedback</button>
        </form>
    </div>
</main>
